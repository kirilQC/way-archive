<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Topics redesigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b101e; --panel: #111830; --panel-2: #172038; --line: #232d4c;
    --text: #eef1f7; --muted: #8d96b0; --navy: #1c3061;
    --amber: #8caef2; --amber-dim: rgba(140,174,242,0.14);
    --serif: 'Fraunces', serif; --sans: 'Inter', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); padding-bottom: 90px; }
  a { color: inherit; text-decoration: none; }
  .hdr { padding: 20px 44px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
  .hdr .mark { background: var(--navy); color: #fff; font-weight: 800; font-size: 20px; letter-spacing: 0.06em; padding: 8px 15px 9px; border-radius: 7px; }
  .hdr nav { display: flex; gap: 26px; font-size: 13.5px; color: var(--muted); font-weight: 500; }
  .hdr nav b { color: var(--text); }
  .variant { display: none; min-height: calc(100vh - 170px); }
  .variant.show { display: block; }
  .switch { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(9,13,26,0.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; z-index: 99; }
  .switch button { background: var(--panel); border: 1px solid var(--line); color: var(--muted); font: 600 12px var(--sans); border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .switch button.on { background: var(--amber-dim); border-color: var(--amber); color: var(--amber); }
  .h1x { font-family: var(--serif); font-size: 46px; font-weight: 500; }
  .h1x em { color: var(--amber); font-style: italic; }

  /* V1 Bento Mosaic */
  .v1 .wrap { max-width: 1240px; margin: 46px auto 0; padding: 0 32px; }
  .v1 .bento { margin-top: 30px; display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 150px; gap: 14px; }
  .v1 .cell { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); display: flex; align-items: flex-end; padding: 18px; transition: transform 0.25s; }
  .v1 .cell:hover { transform: translateY(-4px); }
  .v1 .cell img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.45) saturate(1.1); transition: transform 0.6s, filter 0.3s; }
  .v1 .cell:hover img { transform: scale(1.06); filter: brightness(0.6) saturate(1.2); }
  .v1 .cell .lab { position: relative; }
  .v1 .cell .lab b { font-family: var(--serif); font-size: 24px; font-weight: 500; display: block; }
  .v1 .cell .lab span { font-size: 12.5px; color: #c3c9dd; }
  .v1 .cell.big { grid-column: span 2; grid-row: span 2; }
  .v1 .cell.big .lab b { font-size: 36px; }
  .v1 .cell.wide { grid-column: span 2; }

  /* V2 Editorial Index */
  .v2 .wrap { max-width: 940px; margin: 56px auto 0; padding: 0 24px; }
  .v2 .rows { margin-top: 36px; border-top: 1px solid var(--line); }
  .v2 .row { display: flex; align-items: baseline; gap: 22px; padding: 22px 6px; border-bottom: 1px solid var(--line); cursor: pointer; position: relative; transition: padding-left 0.25s; }
  .v2 .row:hover { padding-left: 18px; }
  .v2 .row .n { font-family: var(--serif); color: var(--muted); font-size: 15px; width: 34px; flex: none; }
  .v2 .row b { font-family: var(--serif); font-size: 34px; font-weight: 500; transition: color 0.2s; }
  .v2 .row:hover b { color: var(--amber); }
  .v2 .row .cnt { margin-left: auto; color: var(--muted); font-size: 13.5px; }
  .v2 .row .peek { position: absolute; right: 120px; top: 50%; transform: translateY(-50%) rotate(-3deg) scale(0.9); width: 170px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; box-shadow: 0 18px 50px rgba(0,0,0,0.55); }
  .v2 .row:hover .peek { opacity: 1; transform: translateY(-50%) rotate(-3deg) scale(1); }

  /* V3 Type Scale */
  .v3 .wrap { max-width: 1100px; margin: 70px auto 0; padding: 0 32px; text-align: center; }
  .v3 .cloud { margin-top: 50px; display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 10px 26px; }
  .v3 .cloud a { font-family: var(--serif); font-weight: 500; line-height: 1.3; color: #aeb6cc; transition: color 0.2s; position: relative; }
  .v3 .cloud a:hover { color: var(--amber); }
  .v3 .cloud a sup { font-size: 12px; color: var(--muted); font-family: var(--sans); margin-left: 4px; }
  .v3 .s1 { font-size: 64px; color: var(--text) !important; }
  .v3 .s1:hover { color: var(--amber) !important; }
  .v3 .s2 { font-size: 46px; color: #d5dbe8; }
  .v3 .s3 { font-size: 32px; }
  .v3 .s4 { font-size: 22px; color: #8d96b0; }

  /* V4 Featured Split */
  .v4 .lay { max-width: 1240px; margin: 46px auto 0; padding: 0 32px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 46px; align-items: start; }
  .v4 .feat { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 4/4.6; border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: flex-end; padding: 34px; }
  .v4 .feat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.5); }
  .v4 .feat > * { position: relative; }
  .v4 .feat .k { color: var(--amber); font-size: 12px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .v4 .feat b { font-family: var(--serif); font-size: 52px; font-weight: 500; display: block; margin: 8px 0 6px; }
  .v4 .feat span { color: #c3c9dd; font-size: 14px; }
  .v4 .list { display: flex; flex-direction: column; }
  .v4 .li { display: flex; align-items: center; gap: 16px; padding: 13px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .v4 .li img { width: 104px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; flex: none; }
  .v4 .li b { font-family: var(--serif); font-size: 20px; font-weight: 500; }
  .v4 .li .cnt { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .v4 .li:hover b { color: var(--amber); }

  /* V5 Cinema Wall */
  .v5x { position: relative; overflow: hidden; }
  .v5x .bgs { position: absolute; inset: -60px; display: grid; grid-template-columns: 1fr 1fr 1fr; filter: blur(52px) brightness(0.3) saturate(1.3); }
  .v5x .bgs div { background-size: cover; background-position: center; }
  .v5x .inner { position: relative; text-align: center; padding: 90px 24px 40px; }
  .v5x .tags { max-width: 900px; margin: 44px auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .v5x .tag { background: rgba(17,24,48,0.62); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; padding: 13px 22px; font: 500 15px var(--sans); color: #d5dbe8; cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
  .v5x .tag:hover { border-color: var(--amber); transform: translateY(-2px); }
  .v5x .tag i { font-style: normal; color: var(--amber); font-weight: 700; margin-left: 8px; font-size: 12.5px; }

  /* V6 Ledger Columns */
  .v6 .wrap { max-width: 1140px; margin: 56px auto 0; padding: 0 32px; }
  .v6 .cols { margin-top: 40px; column-count: 3; column-gap: 54px; }
  .v6 .item { break-inside: avoid; display: flex; align-items: baseline; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .v6 .item b { font-family: var(--serif); font-size: 21px; font-weight: 500; }
  .v6 .item:hover b { color: var(--amber); }
  .v6 .item .dots { flex: 1; border-bottom: 1px dotted #3a466e; transform: translateY(-4px); }
  .v6 .item .cnt { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

  /* V7 Filmstrip Rows */
  .v7 .wrap { max-width: 1240px; margin: 46px auto 0; padding: 0 32px; }
  .v7 .strip { margin-top: 34px; }
  .v7 .srow { display: grid; grid-template-columns: 260px 1fr; gap: 26px; align-items: center; padding: 18px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .v7 .srow .l b { font-family: var(--serif); font-size: 30px; font-weight: 500; display: block; }
  .v7 .srow:hover .l b { color: var(--amber); }
  .v7 .srow .l span { color: var(--muted); font-size: 13px; }
  .v7 .srow .thumbs { display: flex; gap: 10px; overflow: hidden; }
  .v7 .srow .thumbs img { width: 148px; aspect-ratio: 16/9; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); flex: none; transition: transform 0.3s; }
  .v7 .srow:hover .thumbs img { transform: translateX(-6px); }
  .v7 .srow .thumbs .more { flex: none; width: 148px; aspect-ratio: 16/9; border-radius: 10px; border: 1px dashed #3a466e; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

  /* V8 Deck of Cards */
  .v8 .wrap { max-width: 1240px; margin: 46px auto 0; padding: 0 32px; }
  .v8 .deck { margin-top: 34px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .v8 .stack { cursor: pointer; }
  .v8 .fan { position: relative; aspect-ratio: 16/10.5; }
  .v8 .fan img { position: absolute; inset: 0; width: 100%; height: 88%; object-fit: cover; border-radius: 12px; border: 1px solid var(--line); transition: transform 0.3s; }
  .v8 .fan img:nth-child(1) { transform: rotate(-4deg) translateY(6px); filter: brightness(0.55); }
  .v8 .fan img:nth-child(2) { transform: rotate(2.5deg) translateY(3px); filter: brightness(0.75); }
  .v8 .fan img:nth-child(3) { transform: rotate(0deg); }
  .v8 .stack:hover .fan img:nth-child(1) { transform: rotate(-7deg) translateY(8px) translateX(-6px); }
  .v8 .stack:hover .fan img:nth-child(2) { transform: rotate(5deg) translateY(4px) translateX(6px); }
  .v8 .stack:hover .fan img:nth-child(3) { transform: translateY(-4px); }
  .v8 .stack b { font-family: var(--serif); font-size: 22px; font-weight: 500; display: block; margin-top: 14px; }
  .v8 .stack span { color: var(--muted); font-size: 12.5px; }

  @media (max-width: 900px) {
    .v1 .bento { grid-template-columns: 1fr 1fr; }
    .v4 .lay { grid-template-columns: 1fr; }
    .v6 .cols { column-count: 1; }
    .v7 .srow { grid-template-columns: 1fr; }
    .v8 .deck { grid-template-columns: 1fr 1fr; }
    .h1x { font-size: 34px; }
  }
</style>
</head>
<body>

<div class="hdr">
  <div class="mark">WAY</div>
  <nav><span>Sermons</span><span>Series</span><span>Speakers</span><b>Topics</b><span>Books</span><span>Ask</span><span>YouTube</span></nav>
</div>

<section class="variant v1" id="v1"><div class="wrap"><h1 class="h1x">What's been <em>preached on.</em></h1><div class="bento" id="bento"></div></div></section>
<section class="variant v2" id="v2"><div class="wrap"><h1 class="h1x">The index of <em>everything taught.</em></h1><div class="rows" id="rows2"></div></div></section>
<section class="variant v3" id="v3"><div class="wrap"><h1 class="h1x">Pick a thread. <em>Pull it.</em></h1><div class="cloud" id="cloud3"></div></div></section>
<section class="variant v4" id="v4"><div style="max-width:1240px;margin:46px auto 0;padding:0 32px"><h1 class="h1x">What's been <em>preached on.</em></h1></div><div class="lay" id="lay4"></div></section>
<section class="variant v5x" id="v5">
  <div class="bgs">
    <div style="background-image:url('https://i.ytimg.com/vi/4KCJtpY59Z4/maxresdefault.jpg')"></div>
    <div style="background-image:url('https://i.ytimg.com/vi/CfpvQ4IuWdQ/maxresdefault.jpg')"></div>
    <div style="background-image:url('https://i.ytimg.com/vi/GsglpMuRjic/maxresdefault.jpg')"></div>
  </div>
  <div class="inner"><h1 class="h1x">What's been <em>preached on.</em></h1><div class="tags" id="tags5"></div></div>
</section>
<section class="variant v6" id="v6"><div class="wrap"><h1 class="h1x">Twenty-three topics. <em>One table of contents.</em></h1><div class="cols" id="cols6"></div></div></section>
<section class="variant v7" id="v7"><div class="wrap"><h1 class="h1x">What's been <em>preached on.</em></h1><div class="strip" id="strip7"></div></div></section>
<section class="variant v8" id="v8"><div class="wrap"><h1 class="h1x">What's been <em>preached on.</em></h1><div class="deck" id="deck8"></div></div></section>

<div class="switch" id="switch"></div>

<script>
  // Real data from Supabase (Sep 2026)
  const T = [
    { n: 'Community', c: 49, th: ['4KCJtpY59Z4', 'CfpvQ4IuWdQ', 'GsglpMuRjic'] },
    { n: 'Grace', c: 36, th: ['CfpvQ4IuWdQ', 'nSpCUCnFCus', '46zVMFuXMsU'] },
    { n: 'Holiness', c: 36, th: ['pMJq1abak9M', 'b42BkFdMkgg', '4KCJtpY59Z4'] },
    { n: 'Identity', c: 35, th: ['nSpCUCnFCus', 'GsglpMuRjic', 'pMJq1abak9M'] },
    { n: 'Hope', c: 32, th: ['GsglpMuRjic', '4pbR1DBXDFs', 'CfpvQ4IuWdQ'] },
    { n: 'Salvation', c: 30, th: ['nSpCUCnFCus', 'OTngLMPGWPY', 'b42BkFdMkgg'] },
    { n: 'Generosity', c: 21, th: ['46zVMFuXMsU', 'nSpCUCnFCus', '4KCJtpY59Z4'] },
    { n: 'Sin & Repentance', c: 20, th: ['pMJq1abak9M', 'CfpvQ4IuWdQ', 'OTngLMPGWPY'] },
    { n: 'Worship', c: 16, th: ['b42BkFdMkgg', 'GsglpMuRjic', '46zVMFuXMsU'] },
    { n: 'Prayer', c: 15, th: ['OTngLMPGWPY', '4pbR1DBXDFs', 'pMJq1abak9M'] },
    { n: 'Evangelism', c: 15, th: ['4KCJtpY59Z4', '46zVMFuXMsU', 'b42BkFdMkgg'] },
    { n: 'Suffering', c: 14, th: ['GsglpMuRjic', 'OTngLMPGWPY', '4pbR1DBXDFs'] },
    { n: 'Purpose', c: 13, th: ['b42BkFdMkgg', '4KCJtpY59Z4', 'nSpCUCnFCus'] },
    { n: 'Forgiveness', c: 12, th: ['nSpCUCnFCus', 'pMJq1abak9M', 'CfpvQ4IuWdQ'] },
    { n: 'Fear & Anxiety', c: 11, th: ['CfpvQ4IuWdQ', 'YButSa3hS3g', 'GsglpMuRjic'] },
    { n: 'Faith', c: 10, th: ['4pbR1DBXDFs', 'b42BkFdMkgg', 'OTngLMPGWPY'] },
    { n: 'Relationships', c: 9, th: ['46zVMFuXMsU', 'nSpCUCnFCus', '4KCJtpY59Z4'] },
    { n: 'Money', c: 8, th: ['nSpCUCnFCus', '46zVMFuXMsU', 'b42BkFdMkgg'] },
  ];
  const img = (id) => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
  const plural = (c) => c + ' sermon' + (c === 1 ? '' : 's');

  // V1 bento: 1 big, 2 wide, rest normal
  document.getElementById('bento').innerHTML = T.slice(0, 11).map((t, i) => {
    const cls = i === 0 ? 'cell big' : (i === 3 || i === 6 ? 'cell wide' : 'cell');
    return `<a class="${cls}"><img src="${img(t.th[0])}" /><span class="lab"><b>${t.n}</b><span>${plural(t.c)}</span></span></a>`;
  }).join('');

  // V2 editorial rows
  document.getElementById('rows2').innerHTML = T.map((t, i) =>
    `<a class="row"><span class="n">${String(i + 1).padStart(2, '0')}</span><b>${t.n}</b><img class="peek" src="${img(t.th[0])}" /><span class="cnt">${plural(t.c)}</span></a>`
  ).join('');

  // V3 type scale
  document.getElementById('cloud3').innerHTML = T.map((t) => {
    const s = t.c >= 40 ? 's1' : t.c >= 25 ? 's2' : t.c >= 14 ? 's3' : 's4';
    return `<a class="${s}">${t.n}<sup>${t.c}</sup></a>`;
  }).join('');

  // V4 featured split
  const f = T[0];
  document.getElementById('lay4').innerHTML =
    `<a class="feat"><img src="${img(f.th[0])}" /><span class="k">Most preached</span><b>${f.n}</b><span>${plural(f.c)} · latest: How to Make a Difference</span></a>` +
    `<div class="list">` + T.slice(1, 10).map((t) =>
      `<a class="li"><img src="${img(t.th[0])}" /><b>${t.n}</b><span class="cnt">${plural(t.c)}</span></a>`
    ).join('') + `</div>`;

  // V5 cinema tags
  document.getElementById('tags5').innerHTML = T.map((t) =>
    `<a class="tag">${t.n}<i>${t.c}</i></a>`
  ).join('');

  // V6 ledger
  document.getElementById('cols6').innerHTML = T.map((t) =>
    `<a class="item"><b>${t.n}</b><span class="dots"></span><span class="cnt">${t.c}</span></a>`
  ).join('');

  // V7 filmstrip
  document.getElementById('strip7').innerHTML = T.slice(0, 8).map((t) =>
    `<a class="srow"><span class="l"><b>${t.n}</b><span>${plural(t.c)}</span></span><span class="thumbs">${t.th.map((h) => `<img src="${img(h)}" />`).join('')}<span class="more">+${Math.max(0, t.c - 3)} more</span></span></a>`
  ).join('');

  // V8 deck
  document.getElementById('deck8').innerHTML = T.slice(0, 12).map((t) =>
    `<a class="stack"><span class="fan">${t.th.map((h) => `<img src="${img(h)}" />`).join('')}</span><b>${t.n}</b><span>${plural(t.c)}</span></a>`
  ).join('');

  const NAMES = ['1 · Bento Mosaic', '2 · Editorial Index', '3 · Type Scale', '4 · Featured Split', '5 · Cinema Tags', '6 · Table of Contents', '7 · Filmstrip Rows', '8 · Card Decks'];
  const bar = document.getElementById('switch');
  NAMES.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => show(i + 1);
    bar.appendChild(b);
  });
  function show(n) {
    document.querySelectorAll('.variant').forEach((v) => v.classList.remove('show'));
    document.getElementById('v' + n).classList.add('show');
    [...bar.children].forEach((b, i) => b.classList.toggle('on', i === n - 1));
    window.scrollTo(0, 0);
  }
  show(1);
</script>
</body>
</html>
