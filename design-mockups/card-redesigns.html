<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sermon Card Redesigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b101e; --panel: #111830; --panel-2: #172038; --line: #232d4c;
    --text: #eef1f7; --muted: #8d96b0; --navy: #1c3061;
    --amber: #8caef2; --amber-dim: rgba(140,174,242,0.14);
    --violet: #8f7df0; --violet-dim: rgba(143,125,240,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
  a { color: inherit; text-decoration: none; display: block; }
  img { display: block; }

  .fake-header {
    padding: 18px 44px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(11,16,30,0.9);
    backdrop-filter: blur(10px); z-index: 50;
  }
  .logo-mark { background: var(--navy); color: #fff; font-weight: 800; font-size: 20px; letter-spacing: 0.06em; padding: 8px 14px 9px; border-radius: 7px; }
  .fake-tabs { display: flex; gap: 6px; }
  .fake-tabs span { color: var(--muted); font-size: 13px; font-weight: 500; padding: 7px 13px; border-radius: 10px; }
  .fake-tabs span.on { color: var(--amber); background: var(--amber-dim); }

  .variant { display: none; padding-bottom: 130px; }
  .variant.show { display: block; }
  .vtag {
    max-width: 1340px; margin: 26px auto 18px; padding: 0 24px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  .wrap { max-width: 1340px; margin: 0 auto; padding: 0 24px; }

  .switch {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; background: rgba(13,18,34,0.92); border: 1px solid var(--line);
    padding: 7px; border-radius: 14px; z-index: 99; backdrop-filter: blur(12px); flex-wrap: wrap; justify-content: center;
    max-width: 96vw;
  }
  .switch button {
    background: none; border: 0; color: var(--muted); font: 600 12px Inter, sans-serif;
    padding: 8px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .switch button.on { background: var(--amber); color: #0b101e; }

  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 1000px) { .g3 { grid-template-columns: 1fr 1fr; } .g2 { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .g3 { grid-template-columns: 1fr; } }

  /* Shared bits */
  .dur { position: absolute; right: 10px; bottom: 10px; background: rgba(11,16,30,0.8); backdrop-filter: blur(6px); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 7px; }
  .chip-v { font-size: 11.5px; font-weight: 700; color: var(--amber); background: var(--amber-dim); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .chip-t { font-size: 11.5px; font-weight: 600; color: #b9a8ff; background: var(--violet-dim); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .sum { font-size: 13.5px; line-height: 1.65; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* ===== V1 Elevated Classic ===== */
  .c1 { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s, box-shadow 0.25s; }
  .c1:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
  .c1 .th { position: relative; aspect-ratio: 16/9; overflow: hidden; }
  .c1 .th img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
  .c1:hover .th img { transform: scale(1.04); }
  .c1 .body { padding: 20px; }
  .c1 .date { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .c1 h3 { font-family: Fraunces, serif; font-size: 22px; font-weight: 500; line-height: 1.18; margin-bottom: 10px; }
  .c1:hover h3 { color: var(--amber); }
  .c1 .sum { margin-bottom: 16px; }
  .c1 .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ===== V2 Footer Bar ===== */
  .c2 { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.25s, border-color 0.2s; }
  .c2:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); }
  .c2 .th { position: relative; aspect-ratio: 16/9; }
  .c2 .th img { width: 100%; height: 100%; object-fit: cover; }
  .c2 .body { padding: 18px 20px; flex: 1; }
  .c2 .date { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .c2 h3 { font-family: Fraunces, serif; font-size: 21px; font-weight: 500; line-height: 1.2; margin-bottom: 9px; }
  .c2:hover h3 { color: var(--amber); }
  .c2 .foot {
    border-top: 1px solid var(--line); padding: 12px 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .c2 .foot b { font-size: 12px; font-weight: 700; color: var(--amber); white-space: nowrap; }
  .c2 .foot .tps { display: flex; gap: 10px; font-size: 12px; color: var(--muted); font-weight: 600; overflow: hidden; }
  .c2 .foot .tps span { white-space: nowrap; }

  /* ===== V3 Split Panel ===== */
  .c3 { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: grid; grid-template-columns: 46% 1fr; transition: transform 0.25s, border-color 0.2s; }
  .c3:hover { transform: translateY(-5px); border-color: rgba(140,174,242,0.5); }
  .c3 .th { position: relative; min-height: 100%; }
  .c3 .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .c3 .body { padding: 20px 22px; display: flex; flex-direction: column; }
  .c3 .date { font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
  .c3 h3 { font-family: Fraunces, serif; font-size: 21px; font-weight: 500; line-height: 1.2; margin-bottom: 10px; }
  .c3:hover h3 { color: var(--amber); }
  .c3 .sum { flex: 1; margin-bottom: 14px; }
  .c3 .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  @media (max-width: 640px) { .c3 { grid-template-columns: 1fr; } .c3 .th { aspect-ratio: 16/9; } }

  /* ===== V4 Scripture Ribbon ===== */
  .c4 { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s; }
  .c4:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); }
  .c4 .th { position: relative; aspect-ratio: 16/9; }
  .c4 .th img { width: 100%; height: 100%; object-fit: cover; }
  .c4 .ribbon {
    position: absolute; left: 0; bottom: 0; right: 0;
    background: linear-gradient(90deg, rgba(11,16,30,0.92), rgba(11,16,30,0.55));
    backdrop-filter: blur(6px); padding: 8px 14px;
    font-family: Fraunces, serif; font-style: italic; font-size: 13.5px; color: var(--amber);
  }
  .c4 .body { padding: 18px 20px 20px; }
  .c4 .date { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .c4 h3 { font-family: Fraunces, serif; font-size: 21px; font-weight: 500; line-height: 1.2; margin-bottom: 9px; }
  .c4:hover h3 { color: var(--amber); }
  .c4 .sum { margin-bottom: 14px; }
  .c4 .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ===== V5 Overlay Editorial ===== */
  .c5 { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 3/3.5; transition: transform 0.25s, border-color 0.2s; }
  .c5:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); }
  .c5 img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
  .c5:hover img.bg { transform: scale(1.05); }
  .c5 .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,16,30,0.05) 20%, rgba(11,16,30,0.72) 55%, rgba(11,16,30,0.97) 100%); }
  .c5 .body { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px; }
  .c5 .date { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #c3c9dd; font-weight: 700; margin-bottom: 7px; }
  .c5 h3 { font-family: Fraunces, serif; font-size: 22px; font-weight: 500; line-height: 1.16; margin-bottom: 9px; }
  .c5 .sum { color: #b9c0d4; margin-bottom: 14px; -webkit-line-clamp: 2; }
  .c5 .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ===== V6 Left Ruler ===== */
  .c6 { position: relative; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 16px; overflow: hidden; transition: transform 0.25s, border-color 0.2s; }
  .c6:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); border-left-color: var(--amber); }
  .c6 .th { position: relative; aspect-ratio: 16/8.5; }
  .c6 .th img { width: 100%; height: 100%; object-fit: cover; }
  .c6 .body { padding: 18px 20px 20px; }
  .c6 .date { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .c6 h3 { font-family: Fraunces, serif; font-size: 21px; font-weight: 500; line-height: 1.2; margin-bottom: 9px; }
  .c6:hover h3 { color: var(--amber); }
  .c6 .sum { margin-bottom: 14px; }
  .c6 .vq {
    font-family: Fraunces, serif; font-style: italic; font-size: 14px; color: var(--amber);
    margin-bottom: 12px; display: block;
  }
  .c6 .chips { display: flex; gap: 6px; flex-wrap: wrap; }

  /* ===== V7 Tags on Frame ===== */
  .c7 { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s; }
  .c7:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); }
  .c7 .th { position: relative; aspect-ratio: 16/9; }
  .c7 .th img { width: 100%; height: 100%; object-fit: cover; }
  .c7 .th .chips { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; right: 70px; }
  .c7 .th .chip-v, .c7 .th .chip-t { backdrop-filter: blur(8px); background: rgba(11,16,30,0.72); border: 1px solid rgba(140,174,242,0.35); }
  .c7 .th .chip-t { border-color: rgba(143,125,240,0.4); }
  .c7 .body { padding: 18px 20px 20px; }
  .c7 .date { font-size: 12px; color: var(--muted); margin-bottom: 7px; }
  .c7 h3 { font-family: Fraunces, serif; font-size: 21px; font-weight: 500; line-height: 1.2; margin-bottom: 9px; }
  .c7:hover h3 { color: var(--amber); }

  /* ===== V8 Journal ===== */
  .c8 { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s; }
  .c8:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); }
  .c8 .th { position: relative; aspect-ratio: 16/9; margin: 12px 12px 0; border-radius: 12px; overflow: hidden; }
  .c8 .th img { width: 100%; height: 100%; object-fit: cover; }
  .c8 .body { padding: 16px 20px 20px; }
  .c8 .toprow { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .c8 .date { font-size: 12px; color: var(--muted); }
  .c8 .vref { font-size: 12px; font-weight: 700; color: var(--amber); }
  .c8 h3 { font-family: Fraunces, serif; font-size: 21px; font-weight: 500; line-height: 1.2; margin-bottom: 9px; }
  .c8:hover h3 { color: var(--amber); }
  .c8 .sum { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 2px dotted var(--line); }
  .c8 .tps { display: flex; gap: 14px; font-size: 12px; font-weight: 600; color: #b9a8ff; }
  .c8 .tps span::before { content: '#'; opacity: 0.6; margin-right: 1px; }
</style>
</head>
<body>

<div class="fake-header">
  <span class="logo-mark">WAY</span>
  <div class="fake-tabs">
    <span class="on">Sermons</span><span>Series</span><span>Speakers</span><span>Topics</span><span>Books</span><span>Ask</span>
  </div>
</div>

<section class="variant" id="v1"><div class="vtag">1 · Elevated Classic</div><div class="wrap g3" id="g1"></div></section>
<section class="variant" id="v2"><div class="vtag">2 · Footer Bar</div><div class="wrap g3" id="g2"></div></section>
<section class="variant" id="v3"><div class="vtag">3 · Split Panel</div><div class="wrap g2" id="g3"></div></section>
<section class="variant" id="v4"><div class="vtag">4 · Scripture Ribbon</div><div class="wrap g3" id="g4"></div></section>
<section class="variant" id="v5"><div class="vtag">5 · Overlay Editorial</div><div class="wrap g3" id="g5"></div></section>
<section class="variant" id="v6"><div class="vtag">6 · Left Ruler</div><div class="wrap g3" id="g6"></div></section>
<section class="variant" id="v7"><div class="vtag">7 · Tags on Frame</div><div class="wrap g3" id="g7"></div></section>
<section class="variant" id="v8"><div class="vtag">8 · Journal</div><div class="wrap g3" id="g8"></div></section>

<div class="switch" id="switch"></div>

<script>
  // Real data from Supabase (Sep 2026)
  const D = [
    { t: 'I Need Peace', sp: 'Grant Troutt', d: 'Monday, Sep 7, 2026', min: 31, th: 'GsglpMuRjic', v: 'Psalm 34:1-3', tp: ['Suffering', 'Hope'], sum: 'Grant Troutt preaches from Psalm 34 about finding peace not by escaping hardship but by learning to walk with God inside the cave of suffering. Peace is developed in depth, not delivered on demand.' },
    { t: 'How to Overcome Anxious Thoughts', sp: 'Noah Herrin', d: 'Monday, Aug 31, 2026', min: 30, th: 'CfpvQ4IuWdQ', v: 'Hebrews 13:7-9', tp: ['Fear & Anxiety', 'Grace'], sum: 'Noah Herrin preaches from Hebrews 13 to show that anxious, negative thoughts can be changed by reorienting our thinking toward the consistent, gracious character of God.' },
    { t: 'I Got the Bag', sp: 'Noah Herrin', d: 'Monday, Aug 24, 2026', min: 37, th: '46zVMFuXMsU', v: 'Matthew 25:14-30', tp: ['Generosity', 'Wisdom'], sum: 'Noah Herrin preaches from the parable of the talents: every follower of Jesus has been entrusted with time, talent, and treasure, and will be held accountable for how it is stewarded.' },
    { t: 'Do Your Job', sp: 'Noah Herrin', d: 'Monday, Aug 17, 2026', min: 33, th: 'b42BkFdMkgg', v: 'Genesis 2:15', tp: ['Worship', 'Purpose'], sum: 'Noah Herrin argues that work is part of God\u2019s good design, given before the Fall, and should be understood as worship, not punishment. The Hebrew word avoda links work and worship.' },
    { t: 'Test God', sp: 'Noah Herrin', d: 'Monday, Aug 10, 2026', min: 41, th: 'leCtfp9lRRo', v: 'Malachi 3:10-11', tp: ['Generosity', 'Worship'], sum: 'Noah Herrin preaches on tithing as a biblical act of stewardship, not a burdensome law: returning the first and best of what God entrusts to us through the local church.' },
    { t: 'The god of Money', sp: 'Noah Herrin', d: 'Monday, Aug 3, 2026', min: 39, th: 'doFs4_gvkqg', v: 'Matthew 6:19-21', tp: ['Money', 'Worship'], sum: 'Noah Herrin launches the Money Moves series, teaching from Matthew 6 that money can either be a tool or an idol. When money becomes a god in our hearts it blinds us and steals our joy.' },
  ];
  const img = (id) => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
  const chips = (s) => `<span class="chip-v">${s.v}</span>${s.tp.map((t) => `<span class="chip-t">${t}</span>`).join('')}`;

  document.getElementById('g1').innerHTML = D.map((s) => `
    <a class="c1">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body">
        <div class="date">${s.d}</div><h3>${s.t}</h3>
        <p class="sum">${s.sum}</p>
        <div class="chips">${chips(s)}</div>
      </div>
    </a>`).join('');

  document.getElementById('g2').innerHTML = D.map((s) => `
    <a class="c2">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body"><div class="date">${s.d}</div><h3>${s.t}</h3><p class="sum">${s.sum}</p></div>
      <div class="foot"><b>${s.v}</b><div class="tps">${s.tp.map((t) => `<span>${t}</span>`).join('')}</div></div>
    </a>`).join('');

  document.getElementById('g3').innerHTML = D.map((s) => `
    <a class="c3">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body">
        <div class="date">${s.d}</div><h3>${s.t}</h3>
        <p class="sum">${s.sum}</p>
        <div class="chips">${chips(s)}</div>
      </div>
    </a>`).join('');

  document.getElementById('g4').innerHTML = D.map((s) => `
    <a class="c4">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span><div class="ribbon">${s.v}</div></div>
      <div class="body">
        <div class="date">${s.d}</div><h3>${s.t}</h3>
        <p class="sum">${s.sum}</p>
        <div class="chips">${s.tp.map((t) => `<span class="chip-t">${t}</span>`).join('')}</div>
      </div>
    </a>`).join('');

  document.getElementById('g5').innerHTML = D.map((s) => `
    <a class="c5">
      <img class="bg" src="${img(s.th)}" /><div class="shade"></div><span class="dur" style="top:10px;bottom:auto;">${s.min} min</span>
      <div class="body">
        <div class="date">${s.d}</div><h3>${s.t}</h3>
        <p class="sum">${s.sum}</p>
        <div class="chips">${chips(s)}</div>
      </div>
    </a>`).join('');

  document.getElementById('g6').innerHTML = D.map((s) => `
    <a class="c6">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body">
        <div class="date">${s.d}</div><h3>${s.t}</h3>
        <p class="sum">${s.sum}</p>
        <span class="vq">${s.v}</span>
        <div class="chips">${s.tp.map((t) => `<span class="chip-t">${t}</span>`).join('')}</div>
      </div>
    </a>`).join('');

  document.getElementById('g7').innerHTML = D.map((s) => `
    <a class="c7">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span><div class="chips">${chips(s)}</div></div>
      <div class="body"><div class="date">${s.d}</div><h3>${s.t}</h3><p class="sum">${s.sum}</p></div>
    </a>`).join('');

  document.getElementById('g8').innerHTML = D.map((s) => `
    <a class="c8">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body">
        <div class="toprow"><span class="date">${s.d}</span><span class="vref">${s.v}</span></div>
        <h3>${s.t}</h3>
        <p class="sum">${s.sum}</p>
        <div class="tps">${s.tp.map((t) => `<span>${t}</span>`).join('')}</div>
      </div>
    </a>`).join('');

  const NAMES = ['Elevated Classic', 'Footer Bar', 'Split Panel', 'Scripture Ribbon', 'Overlay Editorial', 'Left Ruler', 'Tags on Frame', 'Journal'];
  const sw = document.getElementById('switch');
  NAMES.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + ' ' + n;
    b.onclick = () => show(i + 1);
    sw.appendChild(b);
  });
  function show(n) {
    document.querySelectorAll('.variant').forEach((v) => v.classList.remove('show'));
    document.getElementById('v' + n).classList.add('show');
    sw.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === n - 1));
    window.scrollTo(0, 0);
  }
  show(1);
</script>
</body>
</html>
