<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sermon Card Redesigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b101e; --panel: #111830; --panel-2: #172038; --line: #232d4c;
    --text: #eef1f7; --muted: #8d96b0; --navy: #1c3061;
    --amber: #8caef2; --amber-dim: rgba(140,174,242,0.14);
    --violet: #8f7df0; --violet-dim: rgba(143,125,240,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
  a { color: inherit; text-decoration: none; display: block; }
  img { display: block; }

  .fake-header {
    padding: 18px 44px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(11,16,30,0.9);
    backdrop-filter: blur(10px); z-index: 50;
  }
  .logo-mark { background: var(--navy); color: #fff; font-weight: 800; font-size: 20px; letter-spacing: 0.06em; padding: 8px 14px 9px; border-radius: 7px; }
  .fake-tabs { display: flex; gap: 6px; }
  .fake-tabs span { color: var(--muted); font-size: 13px; font-weight: 500; padding: 7px 13px; border-radius: 10px; }
  .fake-tabs span.on { color: var(--amber); background: var(--amber-dim); }

  .variant { display: none; padding-bottom: 130px; }
  .variant.show { display: block; }
  .vtag {
    max-width: 1340px; margin: 26px auto 18px; padding: 0 24px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  .wrap { max-width: 1340px; margin: 0 auto; padding: 0 24px; }

  .switch {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; background: rgba(13,18,34,0.92); border: 1px solid var(--line);
    padding: 7px; border-radius: 14px; z-index: 99; backdrop-filter: blur(12px); flex-wrap: wrap; justify-content: center;
    max-width: 96vw;
  }
  .switch button {
    background: none; border: 0; color: var(--muted); font: 600 12px Inter, sans-serif;
    padding: 8px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .switch button.on { background: var(--amber); color: #0b101e; }

  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 1000px) { .g3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .g3 { grid-template-columns: 1fr; } }

  /* Shared bits */
  .dur { position: absolute; right: 10px; top: 10px; background: rgba(11,16,30,0.8); backdrop-filter: blur(6px); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 7px; z-index: 3; }
  .chip-v { font-size: 11.5px; font-weight: 700; color: var(--amber); background: var(--amber-dim); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .chip-t { font-size: 11.5px; font-weight: 600; color: #b9a8ff; background: var(--violet-dim); padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .date { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #c3c9dd; font-weight: 700; margin-bottom: 7px; }
  h3 { font-family: Fraunces, serif; font-size: 22px; font-weight: 500; line-height: 1.16; margin-bottom: 9px; }
  .sum { font-size: 13.5px; line-height: 1.65; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 14px; }

  /* ===== V1 Seamless Fade: full 16:9 image melts into the content, one continuous poster ===== */
  .n1 { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s, box-shadow 0.25s; }
  .n1:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
  .n1 .th { position: relative; aspect-ratio: 16/9; }
  .n1 .th img {
    width: 100%; height: 100%; object-fit: cover;
    -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
    transition: transform 0.5s;
  }
  .n1:hover .th img { transform: scale(1.03); }
  .n1 .body { padding: 0 22px 22px; margin-top: -6px; }
  .n1:hover h3 { color: var(--amber); }
  .n1 .sum { color: #aab2c8; }

  /* ===== V2 Ambient Glow: blurred thumbnail lights the whole card, sharp full image inset ===== */
  .n2 { position: relative; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s; }
  .n2:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.55); }
  .n2 .glow { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(42px) saturate(1.25) brightness(0.5); transform: scale(1.35); }
  .n2 .scrim { position: absolute; inset: 0; background: rgba(11,16,30,0.52); }
  .n2 .in { position: relative; z-index: 1; }
  .n2 .th { position: relative; margin: 12px 12px 0; border-radius: 11px; overflow: hidden; aspect-ratio: 16/9; box-shadow: 0 14px 34px rgba(0,0,0,0.5); }
  .n2 .th img { width: 100%; height: 100%; object-fit: cover; }
  .n2 .body { padding: 17px 20px 20px; }
  .n2:hover h3 { color: var(--amber); }
  .n2 .sum { color: #b9c0d4; }
  .n2 .chip-v, .n2 .chip-t { backdrop-filter: blur(8px); }

  /* ===== V3 Glass Overlap: full image, frosted panel floats over the bottom edge ===== */
  .n3 { padding-bottom: 4px; transition: transform 0.25s; }
  .n3:hover { transform: translateY(-6px); }
  .n3 .th { position: relative; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .n3 .th img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
  .n3:hover .th img { transform: scale(1.03); }
  .n3 .panel {
    position: relative; margin: -26px 14px 0; border-radius: 14px; padding: 16px 18px 18px;
    background: rgba(13,18,34,0.78); backdrop-filter: blur(16px);
    border: 1px solid rgba(140,174,242,0.22); transition: border-color 0.2s;
  }
  .n3:hover .panel { border-color: rgba(140,174,242,0.5); }
  .n3:hover h3 { color: var(--amber); }
  .n3 h3 { font-size: 20px; }
  .n3 .sum { -webkit-line-clamp: 2; }

  /* ===== V4 Letterboxed Poster: variant 5's poster, full thumbnail over its own blurred fill ===== */
  .n4 { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 3/3.5; transition: transform 0.25s, border-color 0.2s; }
  .n4:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); }
  .n4 .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(34px) brightness(0.42) saturate(1.2); transform: scale(1.3); }
  .n4 .main { position: absolute; top: 0; left: 0; width: 100%; aspect-ratio: 16/9; object-fit: cover; transition: transform 0.6s; }
  .n4 .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,16,30,0) 34%, rgba(11,16,30,0.55) 58%, rgba(11,16,30,0.96) 100%); }
  .n4 .body { position: absolute; left: 0; right: 0; bottom: 0; padding: 20px; }
  .n4:hover h3 { color: var(--amber); }
  .n4 .sum { color: #b9c0d4; -webkit-line-clamp: 2; }

  /* ===== V5 Backlit Panel: full image flush on top, content sits on its own blurred echo ===== */
  .n5 { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s; }
  .n5:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); }
  .n5 .th { position: relative; aspect-ratio: 16/9; }
  .n5 .th img { width: 100%; height: 100%; object-fit: cover; }
  .n5 .body { position: relative; overflow: hidden; }
  .n5 .echo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(52px) brightness(0.32) saturate(1.3); transform: scale(1.6); }
  .n5 .in { position: relative; padding: 18px 20px 20px; }
  .n5:hover h3 { color: var(--amber); }
  .n5 .sum { color: #b3bacd; }
  .n5 .chip-v, .n5 .chip-t { backdrop-filter: blur(8px); }

  /* ===== V6 Editorial Below: borderless magazine listing, image untouched ===== */
  .n6 { transition: transform 0.25s; }
  .n6:hover { transform: translateY(-5px); }
  .n6 .th { position: relative; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; box-shadow: 0 18px 44px rgba(0,0,0,0.45); transition: box-shadow 0.25s; }
  .n6:hover .th { box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(140,174,242,0.4); }
  .n6 .th img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
  .n6:hover .th img { transform: scale(1.04); }
  .n6 .body { padding: 16px 4px 0; }
  .n6 h3 { font-size: 23px; }
  .n6:hover h3 { color: var(--amber); }
  .n6 .sum { border-bottom: 1px solid var(--line); padding-bottom: 14px; }
</style>
</head>
<body>

<div class="fake-header">
  <span class="logo-mark">WAY</span>
  <div class="fake-tabs">
    <span class="on">Sermons</span><span>Series</span><span>Speakers</span><span>Topics</span><span>Books</span><span>Ask</span>
  </div>
</div>

<section class="variant" id="v1"><div class="vtag">1 · Seamless Fade</div><div class="wrap g3" id="g1"></div></section>
<section class="variant" id="v2"><div class="vtag">2 · Ambient Glow</div><div class="wrap g3" id="g2"></div></section>
<section class="variant" id="v3"><div class="vtag">3 · Glass Overlap</div><div class="wrap g3" id="g3"></div></section>
<section class="variant" id="v4"><div class="vtag">4 · Letterboxed Poster</div><div class="wrap g3" id="g4"></div></section>
<section class="variant" id="v5"><div class="vtag">5 · Backlit Panel</div><div class="wrap g3" id="g5"></div></section>
<section class="variant" id="v6"><div class="vtag">6 · Editorial Below</div><div class="wrap g3" id="g6"></div></section>

<div class="switch" id="switch"></div>

<script>
  // Real data from Supabase (Sep 2026)
  const D = [
    { t: 'I Need Peace', sp: 'Grant Troutt', d: 'Monday, Sep 7, 2026', min: 31, th: 'GsglpMuRjic', v: 'Psalm 34:1-3', tp: ['Suffering', 'Hope'], sum: 'Grant Troutt preaches from Psalm 34 about finding peace not by escaping hardship but by learning to walk with God inside the cave of suffering. Peace is developed in depth, not delivered on demand.' },
    { t: 'How to Overcome Anxious Thoughts', sp: 'Noah Herrin', d: 'Monday, Aug 31, 2026', min: 30, th: 'CfpvQ4IuWdQ', v: 'Hebrews 13:7-9', tp: ['Fear & Anxiety', 'Grace'], sum: 'Noah Herrin preaches from Hebrews 13 to show that anxious, negative thoughts can be changed by reorienting our thinking toward the consistent, gracious character of God.' },
    { t: 'I Got the Bag', sp: 'Noah Herrin', d: 'Monday, Aug 24, 2026', min: 37, th: '46zVMFuXMsU', v: 'Matthew 25:14-30', tp: ['Generosity', 'Wisdom'], sum: 'Noah Herrin preaches from the parable of the talents: every follower of Jesus has been entrusted with time, talent, and treasure, and will be held accountable for how it is stewarded.' },
    { t: 'Do Your Job', sp: 'Noah Herrin', d: 'Monday, Aug 17, 2026', min: 33, th: 'b42BkFdMkgg', v: 'Genesis 2:15', tp: ['Worship', 'Purpose'], sum: 'Noah Herrin argues that work is part of God\u2019s good design, given before the Fall, and should be understood as worship, not punishment. The Hebrew word avoda links work and worship.' },
    { t: 'Test God', sp: 'Noah Herrin', d: 'Monday, Aug 10, 2026', min: 41, th: 'leCtfp9lRRo', v: 'Malachi 3:10-11', tp: ['Generosity', 'Worship'], sum: 'Noah Herrin preaches on tithing as a biblical act of stewardship, not a burdensome law: returning the first and best of what God entrusts to us through the local church.' },
    { t: 'The god of Money', sp: 'Noah Herrin', d: 'Monday, Aug 3, 2026', min: 39, th: 'doFs4_gvkqg', v: 'Matthew 6:19-21', tp: ['Money', 'Worship'], sum: 'Noah Herrin launches the Money Moves series, teaching from Matthew 6 that money can either be a tool or an idol. When money becomes a god in our hearts it blinds us and steals our joy.' },
  ];
  const img = (id) => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
  const chips = (s) => `<span class="chip-v">${s.v}</span>${s.tp.map((t) => `<span class="chip-t">${t}</span>`).join('')}`;
  const bodyBlock = (s) => `
    <div class="date">${s.d}</div><h3>${s.t}</h3>
    <p class="sum">${s.sum}</p>
    <div class="chips">${chips(s)}</div>`;

  document.getElementById('g1').innerHTML = D.map((s) => `
    <a class="n1">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body">${bodyBlock(s)}</div>
    </a>`).join('');

  document.getElementById('g2').innerHTML = D.map((s) => `
    <a class="n2">
      <img class="glow" src="${img(s.th)}" /><div class="scrim"></div>
      <div class="in">
        <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
        <div class="body">${bodyBlock(s)}</div>
      </div>
    </a>`).join('');

  document.getElementById('g3').innerHTML = D.map((s) => `
    <a class="n3">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="panel">${bodyBlock(s)}</div>
    </a>`).join('');

  document.getElementById('g4').innerHTML = D.map((s) => `
    <a class="n4">
      <img class="fill" src="${img(s.th)}" />
      <img class="main" src="${img(s.th)}" />
      <div class="shade"></div><span class="dur">${s.min} min</span>
      <div class="body">${bodyBlock(s)}</div>
    </a>`).join('');

  document.getElementById('g5').innerHTML = D.map((s) => `
    <a class="n5">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body"><img class="echo" src="${img(s.th)}" /><div class="in">${bodyBlock(s)}</div></div>
    </a>`).join('');

  document.getElementById('g6').innerHTML = D.map((s) => `
    <a class="n6">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body">${bodyBlock(s)}</div>
    </a>`).join('');

  const NAMES = ['Seamless Fade', 'Ambient Glow', 'Glass Overlap', 'Letterboxed Poster', 'Backlit Panel', 'Editorial Below'];
  const sw = document.getElementById('switch');
  NAMES.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + ' ' + n;
    b.onclick = () => show(i + 1);
    sw.appendChild(b);
  });
  function show(n) {
    document.querySelectorAll('.variant').forEach((v) => v.classList.remove('show'));
    document.getElementById('v' + n).classList.add('show');
    sw.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === n - 1));
    window.scrollTo(0, 0);
  }
  show(1);
</script>
</body>
</html>
