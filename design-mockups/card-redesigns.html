<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sermon Card Redesigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b101e; --panel: #111830; --panel-2: #172038; --line: #232d4c;
    --text: #eef1f7; --muted: #8d96b0; --navy: #1c3061;
    --amber: #8caef2; --amber-dim: rgba(140,174,242,0.14);
    --violet: #8f7df0; --violet-dim: rgba(143,125,240,0.14);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: Inter, sans-serif; }
  a { color: inherit; text-decoration: none; display: block; }
  img { display: block; }

  .fake-header {
    padding: 18px 44px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(11,16,30,0.9);
    backdrop-filter: blur(10px); z-index: 50;
  }
  .logo-mark { background: var(--navy); color: #fff; font-weight: 800; font-size: 20px; letter-spacing: 0.06em; padding: 8px 14px 9px; border-radius: 7px; }
  .fake-tabs { display: flex; gap: 6px; }
  .fake-tabs span { color: var(--muted); font-size: 13px; font-weight: 500; padding: 7px 13px; border-radius: 10px; }
  .fake-tabs span.on { color: var(--amber); background: var(--amber-dim); }

  .variant { display: none; padding-bottom: 130px; }
  .variant.show { display: block; }
  .vtag {
    max-width: 1340px; margin: 26px auto 18px; padding: 0 24px;
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700;
  }
  .wrap { max-width: 1340px; margin: 0 auto; padding: 0 24px; }

  .switch {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 5px; background: rgba(13,18,34,0.92); border: 1px solid var(--line);
    padding: 7px; border-radius: 14px; z-index: 99; backdrop-filter: blur(12px); flex-wrap: wrap; justify-content: center;
    max-width: 96vw;
  }
  .switch button {
    background: none; border: 0; color: var(--muted); font: 600 12px Inter, sans-serif;
    padding: 8px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap;
  }
  .switch button.on { background: var(--amber); color: #0b101e; }

  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
  @media (max-width: 1000px) { .g3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .g3 { grid-template-columns: 1fr; } }

  /* ===== Base card: Seamless Fade (picked) ===== */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; transition: transform 0.25s, border-color 0.2s, box-shadow 0.25s; }
  .card:hover { transform: translateY(-6px); border-color: rgba(140,174,242,0.5); box-shadow: 0 24px 60px rgba(0,0,0,0.45); }
  .card .th { position: relative; aspect-ratio: 16/9; }
  .card .th img {
    width: 100%; height: 100%; object-fit: cover;
    -webkit-mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 78%, transparent 100%);
    transition: transform 0.5s;
  }
  .card:hover .th img { transform: scale(1.03); }
  .dur { position: absolute; right: 10px; top: 10px; background: rgba(11,16,30,0.8); backdrop-filter: blur(6px); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 7px; z-index: 3; }
  .card .body { padding: 0 22px 22px; margin-top: -6px; }
  .date { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #c3c9dd; font-weight: 700; margin-bottom: 7px; }
  h3 { font-family: Fraunces, serif; font-size: 22px; font-weight: 500; line-height: 1.16; margin-bottom: 9px; }
  .card:hover h3 { color: var(--amber); }
  .sum { font-size: 13.5px; line-height: 1.65; color: #aab2c8; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 14px; }

  /* ===== T1 Quiet Meta Line: one plain-text row, no boxes ===== */
  .t1 { font-size: 12.5px; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
  .t1 b { color: var(--amber); font-weight: 700; }
  .t1 span { color: var(--muted); font-weight: 500; }
  .t1 i { font-style: normal; color: #3d4a70; }

  /* ===== T2 Serif Verse: scripture as an italic serif line, topics as micro caps ===== */
  .t2 .vq { font-family: Fraunces, serif; font-style: italic; font-size: 15px; color: var(--amber); margin-bottom: 7px; }
  .t2 .tps { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .t2 .tps i { font-style: normal; color: #3d4a70; margin: 0 6px; }

  /* ===== T3 Hairline Footer: thin rule, verse left, topics right ===== */
  .t3 { border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .t3 b { font-size: 12px; font-weight: 700; color: var(--amber); white-space: nowrap; }
  .t3 .tps { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t3 .tps i { font-style: normal; color: #3d4a70; margin: 0 5px; }

  /* ===== T4 Ghost Outline: chips, but hollow and quiet ===== */
  .t4 { display: flex; gap: 7px; flex-wrap: wrap; }
  .t4 span { font-size: 11.5px; font-weight: 600; padding: 4px 11px; border-radius: 999px; border: 1px solid rgba(141,150,176,0.35); color: var(--muted); background: none; }
  .t4 span.v { border-color: rgba(140,174,242,0.45); color: var(--amber); font-weight: 700; }

  /* ===== T5 Verse in Date Row: scripture lives up top with the date, topics whisper at the bottom ===== */
  .t5date { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; margin-bottom: 7px; }
  .t5date .d { color: #c3c9dd; }
  .t5date .v { color: var(--amber); letter-spacing: 0.06em; white-space: nowrap; }
  .t5tps { font-size: 12px; color: var(--muted); font-weight: 500; }
  .t5tps i { font-style: normal; color: #3d4a70; margin: 0 6px; }

  /* ===== T6 Amber Rule: verse with a short accent underline, topics as plain text after ===== */
  .t6 .v { display: inline-block; font-size: 12.5px; font-weight: 700; color: var(--amber); padding-bottom: 6px; position: relative; margin-bottom: 8px; }
  .t6 .v::after { content: ''; position: absolute; left: 0; bottom: 0; width: 26px; height: 2px; background: var(--amber); border-radius: 2px; }
  .t6 .tps { font-size: 12px; color: var(--muted); font-weight: 500; }
  .t6 .tps i { font-style: normal; color: #3d4a70; margin: 0 6px; }
</style>
</head>
<body>

<div class="fake-header">
  <span class="logo-mark">WAY</span>
  <div class="fake-tabs">
    <span class="on">Sermons</span><span>Series</span><span>Speakers</span><span>Topics</span><span>Books</span><span>Ask</span>
  </div>
</div>

<section class="variant" id="v1"><div class="vtag">1 · Quiet Meta Line</div><div class="wrap g3" id="g1"></div></section>
<section class="variant" id="v2"><div class="vtag">2 · Serif Verse</div><div class="wrap g3" id="g2"></div></section>
<section class="variant" id="v3"><div class="vtag">3 · Hairline Footer</div><div class="wrap g3" id="g3"></div></section>
<section class="variant" id="v4"><div class="vtag">4 · Ghost Outline</div><div class="wrap g3" id="g4"></div></section>
<section class="variant" id="v5"><div class="vtag">5 · Verse in Date Row</div><div class="wrap g3" id="g5"></div></section>
<section class="variant" id="v6"><div class="vtag">6 · Amber Rule</div><div class="wrap g3" id="g6"></div></section>

<div class="switch" id="switch"></div>

<script>
  // Real data from Supabase (Sep 2026)
  const D = [
    { t: 'I Need Peace', sp: 'Grant Troutt', d: 'Monday, Sep 7, 2026', min: 31, th: 'GsglpMuRjic', v: 'Psalm 34:1-3', tp: ['Suffering', 'Hope'], sum: 'Grant Troutt preaches from Psalm 34 about finding peace not by escaping hardship but by learning to walk with God inside the cave of suffering. Peace is developed in depth, not delivered on demand.' },
    { t: 'How to Overcome Anxious Thoughts', sp: 'Noah Herrin', d: 'Monday, Aug 31, 2026', min: 30, th: 'CfpvQ4IuWdQ', v: 'Hebrews 13:7-9', tp: ['Fear & Anxiety', 'Grace'], sum: 'Noah Herrin preaches from Hebrews 13 to show that anxious, negative thoughts can be changed by reorienting our thinking toward the consistent, gracious character of God.' },
    { t: 'I Got the Bag', sp: 'Noah Herrin', d: 'Monday, Aug 24, 2026', min: 37, th: '46zVMFuXMsU', v: 'Matthew 25:14-30', tp: ['Generosity', 'Wisdom'], sum: 'Noah Herrin preaches from the parable of the talents: every follower of Jesus has been entrusted with time, talent, and treasure, and will be held accountable for how it is stewarded.' },
    { t: 'Do Your Job', sp: 'Noah Herrin', d: 'Monday, Aug 17, 2026', min: 33, th: 'b42BkFdMkgg', v: 'Genesis 2:15', tp: ['Worship', 'Purpose'], sum: 'Noah Herrin argues that work is part of God\u2019s good design, given before the Fall, and should be understood as worship, not punishment. The Hebrew word avoda links work and worship.' },
    { t: 'Test God', sp: 'Noah Herrin', d: 'Monday, Aug 10, 2026', min: 41, th: 'leCtfp9lRRo', v: 'Malachi 3:10-11', tp: ['Generosity', 'Worship'], sum: 'Noah Herrin preaches on tithing as a biblical act of stewardship, not a burdensome law: returning the first and best of what God entrusts to us through the local church.' },
    { t: 'The god of Money', sp: 'Noah Herrin', d: 'Monday, Aug 3, 2026', min: 39, th: 'doFs4_gvkqg', v: 'Matthew 6:19-21', tp: ['Money', 'Worship'], sum: 'Noah Herrin launches the Money Moves series, teaching from Matthew 6 that money can either be a tool or an idol. When money becomes a god in our hearts it blinds us and steals our joy.' },
  ];
  const img = (id) => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
  const card = (s, meta, dateHtml) => `
    <a class="card">
      <div class="th"><img src="${img(s.th)}" /><span class="dur">${s.min} min</span></div>
      <div class="body">
        ${dateHtml || `<div class="date">${s.d}</div>`}
        <h3>${s.t}</h3>
        <p class="sum">${s.sum}</p>
        ${meta}
      </div>
    </a>`;
  const dots = (arr, sep = '<i>·</i>') => arr.join(sep);

  document.getElementById('g1').innerHTML = D.map((s) => card(s, `
    <div class="t1"><b>${s.v}</b><i>·</i>${s.tp.map((t) => `<span>${t}</span>`).join('<i>·</i>')}</div>
  `)).join('');

  document.getElementById('g2').innerHTML = D.map((s) => card(s, `
    <div class="t2">
      <div class="vq">${s.v}</div>
      <div class="tps">${dots(s.tp)}</div>
    </div>
  `)).join('');

  document.getElementById('g3').innerHTML = D.map((s) => card(s, `
    <div class="t3"><b>${s.v}</b><span class="tps">${dots(s.tp)}</span></div>
  `)).join('');

  document.getElementById('g4').innerHTML = D.map((s) => card(s, `
    <div class="t4"><span class="v">${s.v}</span>${s.tp.map((t) => `<span>${t}</span>`).join('')}</div>
  `)).join('');

  document.getElementById('g5').innerHTML = D.map((s) => card(s, `
    <div class="t5tps">${dots(s.tp)}</div>
  `, `
    <div class="t5date"><span class="d">${s.d}</span><span class="v">${s.v}</span></div>
  `)).join('');

  document.getElementById('g6').innerHTML = D.map((s) => card(s, `
    <div class="t6">
      <span class="v">${s.v}</span>
      <div class="tps">${dots(s.tp)}</div>
    </div>
  `)).join('');

  const NAMES = ['Quiet Meta Line', 'Serif Verse', 'Hairline Footer', 'Ghost Outline', 'Verse in Date Row', 'Amber Rule'];
  const sw = document.getElementById('switch');
  NAMES.forEach((n, i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + ' ' + n;
    b.onclick = () => show(i + 1);
    sw.appendChild(b);
  });
  function show(n) {
    document.querySelectorAll('.variant').forEach((v) => v.classList.remove('show'));
    document.getElementById('v' + n).classList.add('show');
    sw.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === n - 1));
    window.scrollTo(0, 0);
  }
  show(1);
</script>
</body>
</html>
